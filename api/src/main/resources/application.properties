spring.application.name=api

# ${DB_URL:...} = "si existe la variable de entorno DB_URL, usa esa; si no, lo que va despues de los dos puntos".
# Por defecto: la base roundup en banco-db, el contenedor del curso.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/roundup}
spring.datasource.username=${DB_USUARIO:banco}
spring.datasource.password=${DB_CLAVE:banco123}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false

#NOTA: en mi caso para practicar la parte de docker dicidi crear una bd aparte
# por eso utilizo la variable DB_URL;DB_USUARIO;DB_CLAVE y en el caso de correrlo en
#otra maquina usa las que se usaron en el curso

jwt.clave=${JWT_CLAVE}

logging.level.root=INFO
logging.level.sv.roundup.api=INFO